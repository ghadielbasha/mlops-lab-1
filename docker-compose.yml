services:
  mlflow:
    build: ./mlflow
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/mlflow-data

  inference:
    build: .
    image: food11-api:latest
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - mlflow
    restart: on-failure

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      INFERENCE_URL: http://inference:8000
    depends_on:
      - inference

volumes:
  mlflow-data:
    external: true
    name: food11-mlflow-data

