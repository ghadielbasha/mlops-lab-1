name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check code quality
        run: uv run ruff check src tests

      - name: Run unit tests
        run: uv run pytest -q

  smoke:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build inference Docker image
        run: docker build -t food11-api:ci .

      - name: Start API and check health
        run: |
          docker run -d --name api -p 8000:8000 -e SKIP_MODEL=1 food11-api:ci

          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health; then
              echo "API smoke test passed!"
              exit 0
            fi
            sleep 2
          done

          echo "API smoke test failed!"
          docker logs api
          exit 1
